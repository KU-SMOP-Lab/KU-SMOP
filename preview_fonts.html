<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미리보기 — 글꼴 후보 10가지</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&family=Noto+Serif+KR:wght@400;600;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fafafa; color: #1f2937; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
    .note {
      background: #fff7ed; border: 1px solid #fdba74; border-radius: 6px;
      padding: 1rem 1.25rem; font-size: .9rem; color: #9a3412; line-height: 1.6;
      font-family: sans-serif; margin-bottom: 2.5rem;
    }
    .font-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 1.75rem 2rem; margin-bottom: 1.75rem;
    }
    .font-name {
      font-family: sans-serif; font-size: .8rem; font-weight: 700;
      color: #80350E; letter-spacing: .05em; text-transform: uppercase;
      border-bottom: 2px solid #80350E; padding-bottom: .4rem; margin-bottom: 1.2rem;
    }
    .s-title { font-size: 1.6rem; font-weight: 700; color: #1a2b4a; margin-bottom: .2rem; }
    .s-sub { font-size: .95rem; color: #737373; margin-bottom: 1rem; }
    .s-nav { font-size: .85rem; font-weight: 600; letter-spacing: .05em; color: #444; margin-bottom: 1rem; }
    .s-pub { font-weight: 700; font-size: 1rem; color: #1a2b4a; margin-bottom: .2rem; }
    .s-authors { font-size: .9rem; color: #555; margin-bottom: 1rem; }
    .s-body { font-size: .95rem; line-height: 1.7; color: #374151; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="note">
    <strong>글꼴 후보 10가지</strong> — 같은 내용(페이지 제목 / 메뉴 / 논문 항목 / 본문)을 글꼴만 바꿔 보여줍니다.
    맨 위는 현재 글꼴(비교용)입니다. 한글과 영문이 함께 어떻게 보이는지 봐주세요.
    조합형(제목·본문 다른 글꼴)도 마지막에 2개 있습니다.
  </div>

  <div id="cards"></div>

</div>

<script>
const SAMPLE = `
  <p class="s-nav">HOME &nbsp; PROFESSOR &nbsp; MEMBERS &nbsp; PUBLICATIONS &nbsp; PROJECTS &nbsp; GALLERY</p>
  <p class="s-title">Smart Mobility Operations and Planning Lab</p>
  <p class="s-sub">고려대학교 스마트 모빌리티 운영·계획 연구실</p>
  <p class="s-pub">Multiobjective Transit Network Design with Travel Time Reliability for Conventional and Autonomous Electric Vehicles</p>
  <p class="s-authors">Park, Su Jin; Seungmo Kang — IEEE Access, Vol. 13, pp. 47938-47954</p>
  <p class="s-body">SMOP 연구실은 대중교통 네트워크 최적화, 수요응답형 모빌리티(DRT), 물류 시스템 설계를 연구합니다.
  We develop optimization models and machine learning methods for smart mobility operations and planning.
  2026년 봄학기 대학원생을 모집하고 있습니다.</p>`;

const FONTS = [
  { name: "0. 현재 — Instrument Sans (비교용)", heading: "'Instrument Sans', sans-serif", body: "'Instrument Sans', sans-serif" },
  { name: "1. Pretendard — 가장 널리 쓰이는 모던 한글 폰트", heading: "'Pretendard Variable', sans-serif", body: "'Pretendard Variable', sans-serif" },
  { name: "2. Noto Sans KR — 구글 표준, 무난하고 안정적", heading: "'Noto Sans KR', sans-serif", body: "'Noto Sans KR', sans-serif" },
  { name: "3. IBM Plex Sans KR — 기술적이고 단정한 인상", heading: "'IBM Plex Sans KR', sans-serif", body: "'IBM Plex Sans KR', sans-serif" },
  { name: "4. SUIT — 깔끔하고 현대적, 숫자가 예쁨", heading: "'SUIT Variable', sans-serif", body: "'SUIT Variable', sans-serif" },
  { name: "5. Nanum Gothic — 익숙하고 부담 없는 클래식", heading: "'Nanum Gothic', sans-serif", body: "'Nanum Gothic', sans-serif" },
  { name: "6. Gowun Dodum — 부드럽고 친근한 인상", heading: "'Gowun Dodum', sans-serif", body: "'Gowun Dodum', sans-serif" },
  { name: "7. Noto Serif KR — 명조 계열, 학술적이고 격식 있는 인상", heading: "'Noto Serif KR', serif", body: "'Noto Serif KR', serif" },
  { name: "8. 조합 — 제목 Noto Serif KR + 본문 Pretendard", heading: "'Noto Serif KR', serif", body: "'Pretendard Variable', sans-serif" },
  { name: "9. 조합 — 제목 IBM Plex Sans KR + 본문 Noto Sans KR", heading: "'IBM Plex Sans KR', sans-serif", body: "'Noto Sans KR', sans-serif" },
];

document.getElementById("cards").innerHTML = FONTS.map((f, i) => `
  <div class="font-card" id="f${i}">
    <p class="font-name">${f.name}</p>
    ${SAMPLE}
  </div>
  <style>
    #f${i} .s-title, #f${i} .s-nav, #f${i} .s-pub { font-family: ${f.heading}; }
    #f${i} .s-sub, #f${i} .s-authors, #f${i} .s-body { font-family: ${f.body}; }
  </style>`).join("");
</script>

</body>
</html>
