<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — SMOP Lab</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../css/gallery.css" />
</head>
<body>

<div id="nav-root"></div>
<script src="../components/nav.js"></script>

<div class="page-header">
  <div class="page-header-inner">
    <div class="breadcrumb"><a href="../">Home</a><span>/</span><span>Gallery</span></div>
    <h1>Gallery</h1>
    <p>Lab activities, conferences, and memorable moments</p>
  </div>
</div>

<section>
  <div class="section-inner">

<div class="filter-bar">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="lab-life">연구실 생활</button>
      <button class="filter-btn" data-filter="conferences">학회</button>
      <button class="filter-btn" data-filter="field-trips">답사·MT</button>
      <button class="filter-btn" data-filter="celebrations">축하 행사</button>
      <div class="sort-toggle">
        <button class="sort-btn active" data-sort="newest">최신순</button>
        <button class="sort-btn" data-sort="oldest">오래된순</button>
      </div>
    </div>

    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev">&#8592;</button>
  <button class="lightbox-nav lightbox-next" id="lightbox-next">&#8594;</button>
  <div class="lightbox-inner" id="lightbox-inner">
    <div id="lightbox-content"></div>
    <div class="lightbox-caption">
      <p class="lightbox-title" id="lightbox-title"></p>
      <p class="lightbox-date"  id="lightbox-date"></p>
    </div>
  </div>
</div>

<div id="footer-root"></div>
<script src="../components/footer.js"></script>

<script src="../data/gallery.js"></script>
<script>
let currentEvents = [];   // 현재 필터로 표시 중인 활동들
let currentFilter = "all";
let currentSort = "newest";  // 배열이 최신순이므로 "oldest"면 뒤집어서 표시
let lbEvent = 0;          // 라이트박스가 열려 있는 활동 index
let lbIndex = 0;          // 그 활동 안에서 몇 번째 사진인지

function renderGallery(filter) {
  currentFilter = filter;
  currentEvents = filter === "all" ? GALLERY : GALLERY.filter(g => g.category === filter);
  if (currentSort === "oldest") currentEvents = [...currentEvents].reverse();
  const html = currentEvents.map((ev, ei) => {
    const tiles = (ev.photos && ev.photos.length)
      ? ev.photos.map((p, i) => `
          <div class="event-photo" data-event="${ei}" data-photo="${i}">
            <img src="../${p}" alt="${ev.title}" loading="lazy">
          </div>`).join("")
      : `<div class="event-photo event-photo-empty"><p>사진 준비 중</p></div>`;
    return `
      <div class="gallery-event">
        <p class="event-title">${ev.title}<span class="event-date">${ev.date}</span></p>
        <div class="event-grid">${tiles}</div>
      </div>`;
  }).join("");
  document.getElementById("gallery-grid").innerHTML = html;

  // 세로 사진 자동 인식 → 세로로 긴 칸(가로 2장 높이)으로 표시
  document.querySelectorAll("#gallery-grid .event-photo img").forEach(img => {
    const mark = () => {
      if (img.naturalHeight > img.naturalWidth) img.parentElement.classList.add("portrait");
    };
    if (img.complete && img.naturalWidth) mark();
    else img.addEventListener("load", mark);
  });
}

// 사진 클릭 → lightbox 열기 (이벤트 위임)
document.getElementById("gallery-grid").addEventListener("click", e => {
  const tile = e.target.closest(".event-photo");
  if (!tile || tile.classList.contains("event-photo-empty")) return;
  openLightbox(parseInt(tile.dataset.event), parseInt(tile.dataset.photo));
});

function openLightbox(eventIndex, photoIndex) {
  lbEvent = eventIndex;
  lbIndex = photoIndex;
  showLightboxItem();
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
}

function showLightboxItem() {
  const ev = currentEvents[lbEvent];
  document.getElementById("lightbox-content").innerHTML =
    `<img class="lightbox-img" src="../${ev.photos[lbIndex]}" alt="${ev.title}">`;
  document.getElementById("lightbox-title").textContent = ev.title;
  document.getElementById("lightbox-date").textContent =
    `${ev.date} · ${lbIndex + 1} / ${ev.photos.length}`;

  // 사진이 1장뿐인 활동이면 이전/다음 버튼 숨기기
  const multi = ev.photos.length > 1;
  document.querySelector(".lightbox-prev").style.display = multi ? "" : "none";
  document.querySelector(".lightbox-next").style.display = multi ? "" : "none";
}

function shiftLightbox(dir) {
  const n = currentEvents[lbEvent].photos.length;
  lbIndex = (lbIndex + dir + n) % n;
  showLightboxItem();
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
}

// 닫기 버튼
document.getElementById("lightbox-close").addEventListener("click", closeLightbox);

// 이전/다음 버튼
document.getElementById("lightbox-prev").addEventListener("click", () => shiftLightbox(-1));
document.getElementById("lightbox-next").addEventListener("click", () => shiftLightbox(1));

// 배경(오버레이) 클릭 시 닫기
document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target === document.getElementById("lightbox")) closeLightbox();
});

// 키보드
document.addEventListener("keydown", e => {
  if (!document.getElementById("lightbox").classList.contains("open")) return;
  if (e.key === "Escape")     closeLightbox();
  if (e.key === "ArrowLeft")  shiftLightbox(-1);
  if (e.key === "ArrowRight") shiftLightbox(1);
});

renderGallery("all");

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderGallery(btn.dataset.filter);
  });
});

document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentSort = btn.dataset.sort;
    renderGallery(currentFilter);
  });
});
</script>

</body>
</html>
