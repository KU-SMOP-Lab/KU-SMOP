<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미리보기 — 뉴스 방식 D (클릭 전환)</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #e9eaec; }
    .pv-wrap { max-width: 1050px; margin: 0 auto; padding: 2.5rem 1.25rem 6rem; }
    .pv-note { background: #fff7ed; border: 1px solid #fdba74; border-radius: 6px;
      padding: 1rem 1.25rem; font-size: .9rem; color: #9a3412; line-height: 1.7; margin-bottom: 2.5rem; }
    .frame { background: #fff; padding: 3rem 2.5rem; border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    .sec-title { font-family: var(--font-heading); font-weight: 700; font-size: 1.9rem; color: #215F9A; margin-bottom: 1.8rem; }

    /* 상단: 선택된 소식 크게 */
    .news-featured { padding-bottom: 1.6rem; border-bottom: 1px solid var(--gray-200); margin-bottom: .6rem; }
    .nf-date { font-size: .92rem; font-weight: 600; color: #80350E; }
    .nf-title { font-size: 1.4rem; font-weight: 700; color: var(--navy); margin-top: .35rem; line-height: 1.5; }
    .nf-desc { font-size: 1.02rem; color: var(--gray-600); line-height: 1.85; margin-top: .55rem; }

    /* 하단: 나머지 한 줄 목록 */
    .news-row { display: flex; gap: 1.4rem; align-items: baseline; padding: .85rem 0;
      border-bottom: 1px solid var(--gray-100); cursor: pointer; }
    .news-row:last-child { border-bottom: none; }
    .news-row:hover .nr-title { color: #80350E; }
    .nr-date { font-size: .92rem; color: var(--gray-400); white-space: nowrap; flex-shrink: 0; }
    .nr-title { font-size: 1.08rem; font-weight: 500; color: var(--gray-700); line-height: 1.6; transition: color .15s; }
  </style>
</head>
<body>
<div class="pv-wrap">

  <div class="pv-note">
    <strong>방식 D — 클릭 전환 예시</strong> — 처음에는 가장 최신 소식이 위에 크게 떠 있고,
    아래 목록의 아무 항목이나 <b>클릭하면 그 소식이 위의 큰 자리로 올라옵니다</b> (원래 있던 건 목록으로 내려감).
    직접 눌러보세요.
  </div>

  <div class="frame">
    <h2 class="sec-title">Recent News</h2>
    <div id="featured"></div>
    <div id="rest"></div>
  </div>

</div>

<script>
const NEWS = [
  { date:"2026.07", title:"정구홍 박사님 세미나 및 연구실 MT 진행",
    desc:"정구홍 박사님을 모시고 세미나를 진행한 뒤, 연구실 구성원들과 함께 MT를 다녀왔습니다." },
  { date:"2026.02", title:"백승훈·장시원 석사 학위 취득",
    desc:"백승훈, 장시원 학생이 석사 학위를 취득하였습니다. 백승훈 학생은 현대글로비스에 입사하였고, 장시원 학생은 폐기물 수거 경로 최적화를 주제로 학위논문을 마쳤습니다." },
  { date:"2026.01", title:"TRB Annual Meeting 포스터 발표",
    desc:"미국 Washington D.C.에서 열린 TRB(Transportation Research Board) 연례회의에서 연구 성과를 포스터로 발표했습니다." },
  { date:"2025.12", title:"NeurIPS 2025 포스터 발표",
    desc:"미국 San Diego에서 열린 NeurIPS 2025에서 고차원 도시 모빌리티 문제를 위한 베이지안 최적화 벤치마크(BO4Mob) 연구를 발표했습니다." },
  { date:"2025.11", title:"ACM SIGSPATIAL 포스터 발표",
    desc:"미국 Minneapolis에서 열린 ACM SIGSPATIAL 학회에서 포스터 발표를 진행했습니다." },
  { date:"2025.05", title:"대한교통학회 회장상·최우수상 수상",
    desc:"대한교통학회 학술대회에서 연구실 구성원들이 회장상과 최우수상을 수상했습니다." },
];

let selected = 0;  // 기본값: 맨 위(최신) 소식

function render() {
  const f = NEWS[selected];
  document.getElementById("featured").innerHTML = `
    <div class="news-featured">
      <p class="nf-date">${f.date}</p>
      <p class="nf-title">${f.title}</p>
      <p class="nf-desc">${f.desc}</p>
    </div>`;
  document.getElementById("rest").innerHTML = NEWS.map((n, i) => i === selected ? "" : `
    <div class="news-row" onclick="selected=${i}; render();">
      <span class="nr-date">${n.date}</span>
      <span class="nr-title">${n.title}</span>
    </div>`).join("");
}
render();
</script>

</body>
</html>
