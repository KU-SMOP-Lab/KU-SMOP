<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미리보기 — 갤러리 사진 2열 vs 3열 vs 4열</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/gallery.css" />
  <style>
    body { background: var(--gray-50, #fafafa); }
    .preview-wrap { max-width: 1050px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
    .preview-note {
      background: #fff7ed; border: 1px solid #fdba74; border-radius: 6px;
      padding: 1rem 1.25rem; font-size: .9rem; color: #9a3412; margin-bottom: 2.5rem; line-height: 1.6;
    }
    .option-label {
      font-family: var(--font-heading); font-weight: 700; font-size: 1.35rem;
      color: var(--navy, #1a2b4a); margin: 3.5rem 0 1.25rem;
      padding-top: 2rem; border-top: 3px dashed var(--gray-300);
    }
    .option-label:first-of-type { border-top: none; padding-top: 0; }
    .cols2 .event-grid { grid-template-columns: repeat(2, 1fr); }
    .cols3 .event-grid { grid-template-columns: repeat(3, 1fr); }
    .ph { display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: #fff; font-weight: 700;
      background: linear-gradient(135deg,#93a8c4,#5b729b); }
  </style>
</head>
<body>

<div class="preview-wrap">

  <div class="preview-note">
    <strong>미리보기 페이지</strong> — 같은 두 활동(세미MT 실제 사진 2장 / 사진 많은 활동 예시 8장)을
    한 줄 4개 / 3개 / 2개로 비교합니다.
  </div>

  <h2 class="option-label">한 줄에 4개 (현재)</h2>
  <div>
    <div class="gallery-event">
      <p class="event-title">7월 정구홍 박사님 세미나 및 MT<span class="event-date">2026</span></p>
      <div class="event-grid">
        <div class="event-photo"><img src="images/gallery/2605_세미MT/260722_세미MT_1.jpg"></div>
        <div class="event-photo"><img src="images/gallery/2605_세미MT/260722_세미MT_2.jpg"></div>
      </div>
    </div>
    <div class="gallery-event">
      <p class="event-title">사진이 많은 활동 예시<span class="event-date">8장</span></p>
      <div class="event-grid">
        <div class="event-photo"><div class="ph">1</div></div>
        <div class="event-photo"><div class="ph">2</div></div>
        <div class="event-photo"><div class="ph">3</div></div>
        <div class="event-photo"><div class="ph">4</div></div>
        <div class="event-photo"><div class="ph">5</div></div>
        <div class="event-photo"><div class="ph">6</div></div>
        <div class="event-photo"><div class="ph">7</div></div>
        <div class="event-photo"><div class="ph">8</div></div>
      </div>
    </div>
  </div>

  <h2 class="option-label">한 줄에 3개</h2>
  <div class="cols3">
    <div class="gallery-event">
      <p class="event-title">7월 정구홍 박사님 세미나 및 MT<span class="event-date">2026</span></p>
      <div class="event-grid">
        <div class="event-photo"><img src="images/gallery/2605_세미MT/260722_세미MT_1.jpg"></div>
        <div class="event-photo"><img src="images/gallery/2605_세미MT/260722_세미MT_2.jpg"></div>
      </div>
    </div>
    <div class="gallery-event">
      <p class="event-title">사진이 많은 활동 예시<span class="event-date">8장</span></p>
      <div class="event-grid">
        <div class="event-photo"><div class="ph">1</div></div>
        <div class="event-photo"><div class="ph">2</div></div>
        <div class="event-photo"><div class="ph">3</div></div>
        <div class="event-photo"><div class="ph">4</div></div>
        <div class="event-photo"><div class="ph">5</div></div>
        <div class="event-photo"><div class="ph">6</div></div>
        <div class="event-photo"><div class="ph">7</div></div>
        <div class="event-photo"><div class="ph">8</div></div>
      </div>
    </div>
  </div>

  <h2 class="option-label">한 줄에 2개</h2>
  <div class="cols2">
    <div class="gallery-event">
      <p class="event-title">7월 정구홍 박사님 세미나 및 MT<span class="event-date">2026</span></p>
      <div class="event-grid">
        <div class="event-photo"><img src="images/gallery/2605_세미MT/260722_세미MT_1.jpg"></div>
        <div class="event-photo"><img src="images/gallery/2605_세미MT/260722_세미MT_2.jpg"></div>
      </div>
    </div>
    <div class="gallery-event">
      <p class="event-title">사진이 많은 활동 예시<span class="event-date">8장</span></p>
      <div class="event-grid">
        <div class="event-photo"><div class="ph">1</div></div>
        <div class="event-photo"><div class="ph">2</div></div>
        <div class="event-photo"><div class="ph">3</div></div>
        <div class="event-photo"><div class="ph">4</div></div>
        <div class="event-photo"><div class="ph">5</div></div>
        <div class="event-photo"><div class="ph">6</div></div>
        <div class="event-photo"><div class="ph">7</div></div>
        <div class="event-photo"><div class="ph">8</div></div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
